name: Build owner Android APK

# This is intentionally separate from android-mock-apk.yml. The mock workflow is
# public CI and never accepts a game image. This owner-only workflow refuses to
# run in public repositories because dispatch inputs and build artifacts must not
# expose an owner's game material.
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Direct HTTPS URL to your own original-Xbox .iso/.xiso/.cci/.cso image. Do not use a public URL in a public repository."
        required: true
        type: string
      image_sha256:
        description: "Optional SHA-256 for the downloaded image (recommended)."
        required: false
        type: string
      upload_owner_apk:
        description: "Upload the playable APK as a short-lived private Actions artifact. Leave unchecked if you only want the build verification."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: owner-android-apk-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-owner-apk:
    name: Build from owner-supplied image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Require a private repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::Owner APK builds are disabled in public repositories. Run this workflow only from your private fork."
          exit 1

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/gradle-wrapper.properties

      - name: Install Android SDK, NDK and CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not available}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download owner-supplied disc image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          IMAGE_SHA256: ${{ inputs.image_sha256 }}
        run: |
          set -euo pipefail
          case "$IMAGE_URL" in https://*) ;; *) echo "Only a direct HTTPS URL is accepted." >&2; exit 2 ;; esac
          work="$RUNNER_TEMP/sm2-owner-build"
          mkdir -p "$work"
          # Keep the URL out of command output. The generic .iso suffix lets the
          # extractor identify the container by magic, not by an untrusted name.
          curl --fail --location --retry 3 --retry-delay 3 --proto '=https' \
            --connect-timeout 30 --max-time 1800 --output "$work/owner-disc.iso" "$IMAGE_URL"
          test -s "$work/owner-disc.iso"
          if [ -n "$IMAGE_SHA256" ]; then
            printf '%s  %s\n' "$IMAGE_SHA256" "$work/owner-disc.iso" | sha256sum --check --status
          fi

      - name: Build local XBE tools
        run: |
          cmake -S tools/xbe -B "$RUNNER_TEMP/sm2-xbe-tools" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sm2-xbe-tools" --parallel 2

      - name: Extract and recompile the owner XBE
        run: |
          set -euo pipefail
          mkdir -p assets
          "$RUNNER_TEMP/sm2-xbe-tools/xbe_extract" "$RUNNER_TEMP/sm2-owner-build/owner-disc.iso" assets/default.xbe
          "$RUNNER_TEMP/sm2-xbe-tools/xbe_recomp" config/game.toml --xdk sdk/xdk
          test -f generated/game/x86_func_mapping.cpp
          test -f generated/game/image_symbols.h

      - name: Assemble owner APK
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PxbeGenerated="$GITHUB_WORKSPACE/generated/game" \
            -PxbeImage="$GITHUB_WORKSPACE/assets/default.xbe" \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="owner-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

      - name: Verify APK packaging
        working-directory: android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          unzip -l "$apk" | grep -q " classes.dex$"
          sha256sum "$apk" | tee app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload owner APK
        if: ${{ inputs.upload_owner_apk }}
        uses: actions/upload-artifact@v7
        with:
          name: owner-built-spiderman2-android-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 1

      # Never cache, commit or upload the source image, XBE or generated C++.
      - name: Remove owner game material from runner workspace
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/sm2-owner-build" "$RUNNER_TEMP/sm2-xbe-tools" assets/default.xbe generated/game
